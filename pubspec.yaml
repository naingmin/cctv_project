name: cctv_manager
description: CCTV Data Collection and Management System
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^14.2.0

  # Networking
  dio: ^5.4.3+1

  # Maps (OpenStreetMap). Tile URL is abstracted in AppConfig.
  flutter_map: ^6.1.0
  latlong2: ^0.9.1

  # Location
  geolocator: ^12.0.0

  # Images
  image_picker: ^1.0.7
  cached_network_image: ^3.3.1
  photo_view: ^0.15.0

  # Storage
  flutter_secure_storage: ^9.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # UI
  shimmer: ^3.0.0

  # Environment
  flutter_dotenv: ^5.1.0

  # Utils
  intl: ^0.19.0
  path_provider: ^2.1.2
  path: ^1.9.0
  package_info_plus: ^8.0.0

  # JSON
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  json_serializable: ^6.7.1
  mocktail: ^1.0.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/images/logo.png
    - .env
  # Roboto is bundled instead of being fetched from fonts.gstatic.com at
  # runtime. Flutter web's CanvasKit renderer otherwise downloads it, and if
  # that host is blocked every text run renders blank.
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/roboto-regular.ttf
          weight: 400
        - asset: assets/fonts/roboto-medium.ttf
          weight: 500
        - asset: assets/fonts/roboto-bold.ttf
          weight: 700

# WARNING: this file defines THREE services, but this machine runs a MIXED
# stack. MongoDB and the backend run natively (native `mongod` on 27017, uvicorn
# on 8000); only object storage runs in Docker. Starting `mongodb` or `backend`
# here publishes the same ports a second time, so requests to :8000 land on
# whichever socket wins - and because both services use `restart:
# unless-stopped`, they silently return after any Docker Desktop restart, with
# an EMPTY mongo volume. That exact ambiguity hid a real record from the API.
#
# Pick ONE stack and keep it explicit:
#   object storage only  -> docker compose up -d minio      (current setup)
#   everything in Docker -> stop the native mongod + uvicorn first
#
# The MinIO image was replaced with RustFS; MinIO's open-source server is
# archived and its images/binaries are no longer published. See the service
# below.

services:
  mongodb:
    image: mongo:7
    container_name: cctv-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: cctv_manager
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_USERNAME:-}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_PASSWORD:-}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    # MinIO's open-source server was archived and its images are no longer
    # distributed (Docker Hub returns "repository does not exist", dl.min.io
    # returns 410 Gone), so the pinned image below can no longer be pulled.
    # RustFS is a maintained, S3-API-compatible replacement. The backend talks
    # to this through boto3, so only the image and the credential variable
    # names change - no application code or bucket layout was touched.
    # Renamed to `objectstore` in spirit only; the service/container/volume
    # names stay `minio` so existing local state and docs keep working.
    image: rustfs/rustfs:latest
    container_name: cctv-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      RUSTFS_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      RUSTFS_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_VOLUMES: /data
    volumes:
      - minio_data:/data
    healthcheck:
      # The image has curl but not mc, and it serves MinIO's health path.
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: cctv-backend
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEBUG: ${DEBUG:-false}
      MONGODB_URI: ${MONGODB_URI:-}
      MONGODB_HOST: mongodb
      MONGODB_PORT: ${MONGODB_PORT:-27017}
      MONGODB_USERNAME: ${MONGODB_USERNAME:-}
      MONGODB_PASSWORD: ${MONGODB_PASSWORD:-}
      MONGODB_AUTH_SOURCE: ${MONGODB_AUTH_SOURCE:-admin}
      MONGODB_DATABASE: ${MONGODB_DATABASE:-cctv_manager}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-}
      CCTV_CREDENTIALS_ENCRYPTION_KEY: ${CCTV_CREDENTIALS_ENCRYPTION_KEY:?Set a stable CCTV_CREDENTIALS_ENCRYPTION_KEY in infrastructure/.env}
      # Internal address for S3 calls; the public one is signed into upload
      # URLs and must be reachable from the Flutter client. `localhost` is
      # suitable only when the client runs on this host. For the Android
      # emulator use http://10.0.2.2:9000; for a physical device use this
      # computer's LAN address, e.g. http://192.168.1.20:9000.
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-http://localhost:9000}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-cctv-media}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:3000"]}
      # Dev convenience: `flutter run -d chrome` picks a random port each run,
      # so allow any loopback port. config.py drops this in production.
      CORS_ORIGIN_REGEX: ${CORS_ORIGIN_REGEX:-^https?://(localhost|127\.0\.0\.1)(:[0-9]+)?$}
      DEFAULT_ADMIN_USERNAME: ${DEFAULT_ADMIN_USERNAME:-admin}
      DEFAULT_ADMIN_EMAIL: ${DEFAULT_ADMIN_EMAIL:-admin@example.com}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:-}
    command: >
      sh -c "python -m app.bootstrap && uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  mongo_data:
  minio_data:
